<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        padding: 12px;
        font: 13px/1.45 system-ui, sans-serif;
        color: var(--foreground, #e7e7e7);
        background: var(--background, transparent);
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      p {
        margin: 0 0 8px;
        color: var(--muted-foreground, #9a9a9a);
      }
      kbd {
        font: inherit;
        border: 1px solid var(--border, #3a3a3a);
        border-radius: 4px;
        padding: 1px 5px;
      }
    </style>
  </head>
  <body>
    <h1>OpenRouter Usage</h1>
    <p>
      This sidebar cannot load live usage on Orca 1.4.198. The panel has no worker request API
      and CSP blocks HTTP.
    </p>
    <p>
      Open the command palette and run <kbd>OpenRouter: Open Dashboard</kbd>. That command starts
      the plugin’s local dashboard and opens it in an Orca browser tab.
    </p>
  </body>
</html>
